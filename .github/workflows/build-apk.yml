name: Build APK

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/build-apk.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/build-apk.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;35.0.0" "platforms;android-34" > /dev/null

      - name: Build
        run: bash android/build.sh

      - name: Verify signature
        run: '"$ANDROID_HOME/build-tools/35.0.0/apksigner" verify -v android/MilkBilling.apk'

      - uses: actions/upload-artifact@v4
        with:
          name: MilkBilling-apk
          path: android/MilkBilling.apk
